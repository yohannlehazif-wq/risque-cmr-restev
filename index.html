<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RESTEV 85 - Prototype VR chasse aux risques</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#overlay{position:fixed;z-index:20;left:14px;top:14px;width:min(350px,calc(100% - 28px));padding:13px 15px;color:#fff;background:rgba(10,18,25,.86);border:1px solid #7892a4;border-radius:10px;box-shadow:0 8px 30px #0008;pointer-events:none}
#overlay h1{font-size:20px;margin:0 0 5px}#overlay p{margin:3px 0;font-size:14px}.accent{color:#5ce0d7;font-weight:bold}.dangerText{color:#ff6b5f}.controls{position:fixed;right:14px;top:14px;z-index:21;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.controls button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;color:white;cursor:pointer;box-shadow:0 5px 16px #0006}.vr{background:#a71974}.reset{background:#218c8d}.help{background:#334b5d}.a-enter-vr-button{background:#a71974!important;border-radius:10px!important}.mobileHelp{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;background:#000a;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none}@media(max-width:700px){#overlay{top:65px}.controls{left:14px;right:auto}.mobileHelp{white-space:normal;width:90%;text-align:center}}</style>
</head>
<body>
<div id="overlay">
<h1>RESTEV 85 · SST VR</h1>
<p>Dangers identifiés : <span class="accent" id="score">0 / 8</span></p>
<p id="mission">Inspectez l’entrepôt et pointez les zones dangereuses.</p>
<p id="last" class="dangerText"></p>
</div>
<div class="controls">
<button class="vr" id="enterVr">ENTRER EN VR</button>
<button class="help" id="helpBtn">AIDE</button>
<button class="reset" id="resetBtn">RECOMMENCER</button>
</div>
<div class="mobileHelp">PC : clic + souris, ZQSD/WASD · Casque : viser puis gâchette</div>

<a-scene id="scene" renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true" shadow="type:pcfsoft" webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking" xr-mode-ui="enabled:true">
<a-assets>
  <a-mixin id="steel" material="color:#49535a; metalness:.55; roughness:.55"></a-mixin>
  <a-mixin id="orange" material="color:#a75a24; metalness:.18; roughness:.75"></a-mixin>
  <a-mixin id="cardboard" material="color:#ae7642; roughness:.92"></a-mixin>
</a-assets>

<!-- lumière industrielle -->
<a-sky color="#20272c"></a-sky>
<a-entity light="type:ambient; intensity:.42; color:#bfd0d8"></a-entity>
<a-entity light="type:directional; intensity:.9; color:#fff5df; castShadow:true" position="3 8 5"></a-entity>
<a-entity light="type:point; intensity:.85; distance:18; decay:1.5; color:#e8f5ff" position="0 6 -3"></a-entity>
<a-entity light="type:point; intensity:.7; distance:16; decay:1.5; color:#e8f5ff" position="0 6 10"></a-entity>

<!-- bâtiment -->
<a-plane rotation="-90 0 0" width="32" height="40" color="#777e82" material="roughness:.9" shadow="receive:true"></a-plane>
<a-plane position="0 5 -16" width="32" height="10" color="#a2a9ab" shadow="receive:true"></a-plane>
<a-plane position="-16 5 0" rotation="0 90 0" width="40" height="10" color="#8f989c"></a-plane>
<a-plane position="16 5 0" rotation="0 -90 0" width="40" height="10" color="#8f989c"></a-plane>
<a-plane position="0 10 0" rotation="90 0 0" width="32" height="40" color="#596267"></a-plane>
<!-- néons -->
<a-box position="-5 9.75 -4" width="5" height=".08" depth=".35" color="#ecfbff" material="emissive:#d9f7ff;emissiveIntensity:1.4"></a-box>
<a-box position="5 9.75 -4" width="5" height=".08" depth=".35" color="#ecfbff" material="emissive:#d9f7ff;emissiveIntensity:1.4"></a-box>
<a-box position="0 9.75 8" width="5" height=".08" depth=".35" color="#ecfbff" material="emissive:#d9f7ff;emissiveIntensity:1.4"></a-box>

<!-- allée piétonne -->
<a-plane rotation="-90 0 0" position="0 .012 0" width="2.8" height="36" color="#e2c928"></a-plane>
<a-plane rotation="-90 0 0" position="0 .025 0" width="2.25" height="36" color="#858c8f"></a-plane>

<!-- rayonnages -->
<a-entity id="racks"></a-entity>

<!-- chariot élévateur -->
<a-entity id="forklift" position="-2.8 0 -2.2" rotation="0 22 0" shadow="cast:true">
 <a-box position="0 1 0" width="2.4" height="1.45" depth="1.55" color="#b7742b"></a-box>
 <a-box position="-.48 2.25 0" width="1.15" height="1.5" depth="1.42" color="#222a2e"></a-box>
 <a-box position="-.48 2.3 .02" width=".95" height="1.15" depth="1.46" color="#7293a1" opacity=".5"></a-box>
 <a-cylinder rotation="90 0 0" position="-.75 .43 .84" radius=".43" height=".3" color="#17191b"></a-cylinder>
 <a-cylinder rotation="90 0 0" position=".78 .43 .84" radius=".43" height=".3" color="#17191b"></a-cylinder>
 <a-box position="1.38 1.25 0" width=".18" height="3.2" depth="1.5" color="#272d30"></a-box>
 <a-box position="2.35 .18 .44" width="2.1" height=".12" depth=".16" color="#24282a"></a-box>
 <a-box position="2.35 .18 -.44" width="2.1" height=".12" depth=".16" color="#24282a"></a-box>
</a-entity>

<!-- personne stylisée -->
<a-entity position="1 .0 -2.5">
 <a-cylinder position="0 1.2 0" height="1.45" radius=".3" color="#253f59"></a-cylinder>
 <a-cylinder position="0 1.45 0" height=".65" radius=".34" color="#edbb2f"></a-cylinder>
 <a-sphere position="0 2.12 0" radius=".29" color="#b9815f"></a-sphere>
 <a-sphere position="0 2.36 0" radius=".32" theta-length="90" color="#e6c128"></a-sphere>
 <a-box position="-.16 .45 0" width=".22" height=".9" depth=".25" color="#20282e"></a-box>
 <a-box position=".16 .45 0" width=".22" height=".9" depth=".25" color="#20282e"></a-box>
</a-entity>

<!-- flaque -->
<a-circle position="-4 .035 3.3" rotation="-90 0 0" radius="1.45" color="#387ba0" opacity=".72" material="metalness:.15;roughness:.2"></a-circle>
<a-circle position="-5 .038 3.6" rotation="-90 0 0" radius=".55" color="#387ba0" opacity=".65"></a-circle>

<!-- câbles au sol -->
<a-torus position="3 .08 2.8" rotation="90 0 8" radius="2.1" radius-tubular=".045" arc="220" color="#161616"></a-torus>
<a-torus position="4.4 .08 2.1" rotation="90 0 -35" radius="1.35" radius-tubular=".045" arc="210" color="#b3392d"></a-torus>

<!-- machine ouverte -->
<a-entity position="7 0 3.7"><a-box position="0 1.15 0" width="3" height="2.3" depth="2.1" color="#758087"></a-box>
<a-box position="0 1.25 -1.08" width="2.5" height="1.65" depth=".12" color="#2c3337"></a-box>
<a-torus position="-.65 1.35 -1.2" rotation="0 0 0" radius=".55" radius-tubular=".18" color="#747f84"></a-torus>
<a-torus position=".55 1.25 -1.2" radius=".68" radius-tubular=".2" color="#626c71"></a-torus>
<a-cylinder position="0 1.3 -1.25" rotation="90 0 0" radius=".16" height=".2" color="#111"></a-cylinder></a-entity>

<!-- palette dans l'allée -->
<a-entity position=".05 .12 -8"><a-box width="2.25" height=".22" depth="1.35" color="#80552f"></a-box><a-box position="0 .65 0" width="1.75" height="1.05" depth="1.03" mixin="cardboard"></a-box></a-entity>

<!-- sortie et obstruction -->
<a-box position="10.8 1.55 -15.8" width="2.3" height="3.1" depth=".15" color="#39715c"></a-box>
<a-text value="SORTIE" align="center" position="10.8 3.45 -15.65" color="#43d486" width="5"></a-text>
<a-box position="10.8 .65 -14.7" width="2.4" height="1.3" depth="1.6" mixin="cardboard"></a-box>

<!-- extincteur inaccessible -->
<a-cylinder position="-11 .75 7.5" radius=".25" height="1.25" color="#c93028"></a-cylinder>
<a-box position="-11 .75 6.9" width="1.6" height="1.5" depth="1.1" mixin="cardboard"></a-box>

<!-- stockage instable -->
<a-box position="-10 4.4 -4" rotation="0 0 15" width="2.2" height="1.2" depth="1.6" mixin="cardboard"></a-box>

<!-- projecteur alarme -->
<a-entity id="alarm" position="0 7 -6"><a-cylinder radius=".35" height=".5" color="#6e1515"></a-cylinder><a-sphere position="0 .35 0" radius=".32" color="#ff2b20" material="emissive:#ff2418;emissiveIntensity:2" animation="property:material.emissiveIntensity;dir:alternate;dur:500;loop:true;to:.2"></a-sphere><a-entity light="type:point;color:#ff301f;intensity:1.4;distance:7" animation="property:light.intensity;dir:alternate;dur:500;loop:true;to:.1"></a-entity></a-entity>

<!-- risques, panneau 3D et joueur -->
<a-entity id="hazards"></a-entity>
<a-entity id="infoPanel" visible="false" position="0 2.25 -3.2">
 <a-plane width="4.8" height="2.35" color="#17232b" opacity=".96" material="side:double"></a-plane>
 <a-text id="panelTitle" value="DANGER DETECTE" color="#ff5548" align="center" width="4.5" position="0 .82 .015"></a-text>
 <a-text id="panelBody" value="" color="#fff" align="left" width="4.1" wrap-count="48" position="-2 .42 .02"></a-text>
 <a-plane id="closePanel" class="clickable" width="1.5" height=".42" color="#218c8d" position="0 -.87 .025"></a-plane>
 <a-text value="CONTINUER" color="#fff" align="center" width="2.6" position="0 -.92 .04"></a-text>
</a-entity>

<a-entity id="rig" position="0 0 10">
 <a-camera id="camera" position="0 1.65 0" look-controls wasd-controls="acceleration:22">
  <a-cursor id="cursor" color="#fff" raycaster="objects:.clickable" fuse="false" geometry="primitive:ring;radiusInner:.012;radiusOuter:.022"></a-cursor>
 </a-camera>
 <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.clickable;far:25" haptics></a-entity>
 <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.clickable;far:25" haptics></a-entity>
</a-entity>
</a-scene>

<script>
const riskData=[
 {name:'Coactivité chariot-piéton',pos:'-0.6 1.2 -2.2',damage:'Heurt, collision ou écrasement.',action:'Séparer les flux, matérialiser les voies et limiter la vitesse.'},
 {name:'Sol glissant',pos:'-4 0.25 3.3',damage:'Glissade et chute de plain-pied.',action:'Baliser, absorber la flaque et supprimer la fuite.'},
 {name:'Câbles dans la circulation',pos:'3.6 0.3 2.5',damage:'Trébuchement ou détérioration électrique.',action:'Supprimer le passage au sol ou installer un passage protégé.'},
 {name:'Organe mobile accessible',pos:'6.4 1.4 2.5',damage:'Happement, entraînement ou écrasement.',action:'Remettre un carter asservi et consigner avant intervention.'},
 {name:'Palette dans l’allée',pos:'0 0.85 -8',damage:'Heurt, chute ou obstruction des flux.',action:'Dégager la voie et utiliser une zone de stockage matérialisée.'},
 {name:'Sortie de secours obstruée',pos:'10.8 1.4 -14.6',damage:'Retard d’évacuation en situation d’urgence.',action:'Maintenir la sortie libre, visible et immédiatement ouvrable.'},
 {name:'Extincteur inaccessible',pos:'-11 1.4 6.8',damage:'Retard d’intervention sur un départ de feu.',action:'Laisser l’équipement visible, signalé et accessible.'},
 {name:'Stockage instable en hauteur',pos:'-10 4.5 -4',damage:'Chute d’objet sur une personne.',action:'Stabiliser les charges et placer les charges lourdes en bas.'}
];
let found=new Set(); const hazards=document.querySelector('#hazards');
function makeRack(x,z,rot=0){const e=document.createElement('a-entity');e.setAttribute('position',`${x} 0 ${z}`);e.setAttribute('rotation',`0 ${rot} 0`);for(const px of [-2.25,0,2.25]){const p=document.createElement('a-box');p.setAttribute('position',`${px} 2.4 0`);p.setAttribute('width','.18');p.setAttribute('height','4.8');p.setAttribute('depth','1.65');p.setAttribute('mixin','steel');e.appendChild(p)}for(const y of [.65,2,3.35,4.7]){const b=document.createElement('a-box');b.setAttribute('position',`0 ${y} 0`);b.setAttribute('width','4.7');b.setAttribute('height','.13');b.setAttribute('depth','1.65');b.setAttribute('mixin','orange');e.appendChild(b)}for(const d of [[-1.2,1.28],[1.15,2.62],[-1.1,3.98],[1.05,3.98]]){const c=document.createElement('a-box');c.setAttribute('position',`${d[0]} ${d[1]} 0`);c.setAttribute('width','1.7');c.setAttribute('height','1.05');c.setAttribute('depth','1.4');c.setAttribute('mixin','cardboard');e.appendChild(c)}document.querySelector('#racks').appendChild(e)}
makeRack(-10,-8);makeRack(-10,0);makeRack(10,-7);makeRack(10,1);makeRack(-10,11);makeRack(10,11);
function pulse(h){h.setAttribute('animation','property:scale;dir:alternate;dur:620;loop:true;to:1.28 1.28 1.28')}
riskData.forEach((r,i)=>{const group=document.createElement('a-entity');group.setAttribute('position',r.pos);const orb=document.createElement('a-sphere');orb.setAttribute('radius','.28');orb.setAttribute('color','#ff3025');orb.setAttribute('material','emissive:#ff2418;emissiveIntensity:1.7');orb.setAttribute('class','clickable hazard');orb.dataset.index=i;pulse(orb);const ring=document.createElement('a-torus');ring.setAttribute('radius','.55');ring.setAttribute('radius-tubular','.025');ring.setAttribute('color','#ff7d6f');ring.setAttribute('rotation','90 0 0');ring.setAttribute('animation','property:rotation;to:90 360 0;dur:1600;loop:true;easing:linear');group.append(orb,ring);hazards.appendChild(group);orb.addEventListener('click',()=>detect(i,orb,ring))});
function detect(i,orb,ring){if(found.has(i))return;found.add(i);orb.setAttribute('color','#24c873');orb.setAttribute('material','emissive:#24c873;emissiveIntensity:1.2');orb.removeAttribute('animation');ring.setAttribute('color','#24c873');document.querySelector('#score').textContent=`${found.size} / ${riskData.length}`;document.querySelector('#last').textContent='Danger détecté : '+riskData[i].name;showPanel(riskData[i]);[document.querySelector('#leftHand'),document.querySelector('#rightHand')].forEach(h=>{const c=h.components['tracked-controls'];if(c&&c.controller&&c.controller.gamepad&&c.controller.gamepad.hapticActuators?.[0])c.controller.gamepad.hapticActuators[0].pulse(.55,120)});if(found.size===riskData.length){document.querySelector('#mission').textContent='Mission terminée. Les 8 dangers ont été identifiés.'}}
function showPanel(r){const panel=document.querySelector('#infoPanel');const cam=document.querySelector('#camera');const wp=new THREE.Vector3();cam.object3D.getWorldPosition(wp);const dir=new THREE.Vector3();cam.object3D.getWorldDirection(dir);panel.object3D.position.copy(wp).add(dir.multiplyScalar(3));panel.object3D.position.y=wp.y+.55;panel.object3D.lookAt(wp.x,wp.y+.45,wp.z);document.querySelector('#panelBody').setAttribute('value',`${r.name}\n\nDommage possible : ${r.damage}\n\nPrévention : ${r.action}`);panel.setAttribute('visible','true')}
document.querySelector('#closePanel').addEventListener('click',()=>document.querySelector('#infoPanel').setAttribute('visible','false'));
document.querySelector('#enterVr').onclick=()=>document.querySelector('#scene').enterVR();
document.querySelector('#resetBtn').onclick=()=>location.reload();
document.querySelector('#helpBtn').onclick=()=>alert('Ordinateur : cliquez dans la scène, regardez avec la souris et déplacez-vous avec ZQSD/WASD. Casque : cliquez sur ENTRER EN VR, pointez une balise rouge avec un contrôleur et pressez la gâchette.');
function resize(){const s=document.querySelector('#scene');if(s.renderer){s.resize();s.renderer.setSize(innerWidth,innerHeight,false)}}
addEventListener('load',()=>setTimeout(resize,300));addEventListener('resize',resize);new ResizeObserver(()=>resize()).observe(document.body);
</script>
</body></html>
