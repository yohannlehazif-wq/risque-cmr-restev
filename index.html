<script>const R=[['Coactivité chariot-piéton','-1 1.2 -2','Heurt ou écrasement.','Séparer les flux et limiter la vitesse.'],['Sol glissant','-4 .3 3','Chute de plain-pied.','Baliser, nettoyer et supprimer la fuite.'],['Câbles au sol','3 .3 3','Trébuchement ou risque électrique.','Installer un passage protégé.'],['Machine sans carter','6.5 1.4 3','Happement ou écrasement.','Remettre le carter et consigner.'],['Palette dans l’allée','0 .8 -8','Heurt ou obstruction.','Dégager la circulation.'],['Sortie obstruée','11 1.5 -15.3','Retard d’évacuation.','Maintenir la sortie libre.'],['Extincteur inaccessible','-11 1.3 6.5','Retard sur un départ de feu.','Laisser visible et accessible.'],['Stockage instable','-9 3 -4','Chute d’objet.','Stabiliser et charger lourd en bas.']];let n=0,H=document.querySelector('#hazards');R.forEach((r,i)=>{let g=document.createElement('a-entity');g.setAttribute('position',r[1]);let s=document.createElement('a-sphere');s.setAttribute('class','click');s.setAttribute('radius','.28');s.setAttribute('color','#ff3025');s.setAttribute('material','emissive:#ff2418;emissiveIntensity:1.7');s.setAttribute('animation','property:scale;dir:alternate;dur:650;loop:true;to:1.3 1.3 1.3');let t=document.createElement('a-torus');t.setAttribute('radius','.55');t.setAttribute('radius-tubular','.025');t.setAttribute('color','#ff7568');t.setAttribute('rotation','90 0 0');g.append(s,t);H.appendChild(g);s.onclick=()=>{if(s.dataset.done)return;s.dataset.done=1;n++;s.setAttribute('color','#21c872');s.removeAttribute('animation');t.setAttribute('color','#21c872');document.querySelector('#score').textContent=n+' / 8';document.querySelector('#msg').textContent='Danger détecté : '+r[0];let p=document.querySelector('#panel'),c=document.querySelector('#cam'),wp=new THREE.Vector3(),d=new THREE.Vector3();c.object3D.getWorldPosition(wp);c.object3D.getWorldDirection(d);p.object3D.position.copy(wp).add(d.multiplyScalar(3));p.object3D.position.y=wp.y+.5;p.object3D.lookAt(wp.x,wp.y+.4,wp.z);document.querySelector('#body').setAttribute('value',r[0]+'\n\nDommage : '+r[2]+'\n\nPrévention : '+r[3]);p.setAttribute('visible',true);if(n===8)document.querySelector('#msg').textContent='Mission terminée : 8 dangers identifiés.'}});document.querySelector('#continue').onclick=()=>document.querySelector('#panel').setAttribute('visible',false);document.querySelector('#vr').onclick=()=>document.querySelector('#scene').enterVR();(async()=>{let e=document.querySelector('#status');if(!navigator.xr){e.textContent='WebXR : navigateur non compatible';return}let ok=await navigator.xr.isSessionSupported('immersive-vr');e.textContent=ok?'WebXR : casque détecté':'WebXR : mode casque indisponible'})();</script></body></html>
