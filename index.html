,wp.z);document.querySelector('#body').setAttribute('value',r[0]+'\n\nDommage : '+r[2]+'\n\nPrévention : '+r[3]);p.setAttribute('visible',true);if(n===8)document.querySelector('#msg').textContent='Mission terminée : 8 dangers identifiés.'}});document.querySelector('#continue').onclick=()=>document.querySelector('#panel').setAttribute('visible',false);document.querySelector('#vr').onclick=()=>document.querySelector('#scene').enterVR();(async()=>{let e=document.querySelector('#status');if(!navigator.xr){e.textContent='WebXR : navigateur non compatible';return}let ok=await navigator.xr.isSessionSupported('immersive-vr');e.textContent=ok?'WebXR : casque détecté':'WebXR : mode casque indisponible'})();</script></body></html>
